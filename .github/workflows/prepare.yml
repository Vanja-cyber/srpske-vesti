name: Припрема прегледа (09:10)

on:
  schedule:
    # GitHub ради по UTC. Оба термина покривају лето (CEST) и зиму (CET);
    # index.js пропушта само право покретање (09:00–09:45 по Београду).
    - cron: "10 7 * * *"   # лето: 09:10
    - cron: "10 8 * * *"   # зима: 09:10
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: priprema-pregleda
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Инсталирај зависности
        run: npm install --no-audit --no-fund
      - name: Направи преглед (БЕЗ слања) — уз аутоматске поновне покушаје
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          OWNER_PHONE: ${{ secrets.OWNER_PHONE }}
          OWNER_APIKEY: ${{ secrets.OWNER_APIKEY }}
        run: |
          for i in 1 2 3; do
            node src/index.js --no-send && exit 0
            code=$?
            if [ $code -eq 2 ]; then
              echo "❌ Кредит/кључ проблем (код 2) — без поновних покушаја."
              exit $code
            fi
            echo "⚠️ Покушај $i није успео (код $code). Поново за 30s…"
            sleep 30
          done
          echo "❌ Ни после 3 покушаја."
          exit 1
      - name: Сачувај резултате (docs/ + data/)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs data
          git commit -m "Преглед $(date +%F)" || echo "Нема промена за чување."
          git pull --rebase --autostash || true
          git push || echo "Push прескочен."
